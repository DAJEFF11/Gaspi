name: Build and release Gaspi

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'windows/**'
      - 'installer/**'
      - 'pubspec.*'
      - 'test/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaspi-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.3'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart run test/domain_check.dart
      - run: dart run test/metadata_check.dart
      - run: flutter build windows --release
      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio installation not found' }
          $runtime = Get-ChildItem -LiteralPath "$vsRoot/VC/Redist/MSVC" -Recurse -Filter 'msvcp140.dll' |
            Where-Object { $_.Directory.Name -like 'Microsoft.VC*.CRT' -and $_.FullName -match '[\\/]x64[\\/]' -and $_.FullName -notmatch 'onecore' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'Visual C++ x64 runtime not found' }
          Get-ChildItem -LiteralPath $runtime.DirectoryName -Filter '*.dll' | Copy-Item -Destination build/windows/x64/runner/Release
      - name: Package portable Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Gaspi-Windows-portable.zip
      - name: Create Windows installer
        shell: pwsh
        run: |
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          & $compiler installer/gaspi.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Gaspi-Windows
          path: |
            dist/Gaspi-Setup-windows-x64.exe
            dist/Gaspi-Windows-portable.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Package APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Gaspi-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gaspi-Android
          path: dist/Gaspi-Android.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Gaspi-*
          path: dist
          merge-multiple: true
      - name: Publish verified build assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum Gaspi-Setup-windows-x64.exe Gaspi-Windows-portable.zip Gaspi-Android.apk > SHA256SUMS.txt
          cd ..
          TAG="v$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Gaspi $TAG · Windows y Android" --notes-file docs/RELEASE.md --prerelease
          fi

